<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15">
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f7fe0"/>
    </marker>
  </defs>
  <rect width="860" height="380" fill="#ffffff"/>

  <!-- left: bearing of a line -->
  <text x="30" y="32" font-weight="600" fill="#222">1. Bearing θ of a line</text>
  <line x1="170" y1="320" x2="170" y2="70" stroke="#bbb" stroke-dasharray="6 5"/>
  <text x="170" y="60" text-anchor="middle" fill="#555">N (0°)</text>
  <line x1="170" y1="320" x2="330" y2="320" stroke="#bbb" stroke-dasharray="6 5"/>
  <text x="338" y="325" fill="#555">E (90°)</text>
  <line x1="170" y1="320" x2="300" y2="170" stroke="#1f7fe0" stroke-width="5" marker-end="url(#b)"/>
  <circle cx="170" cy="320" r="6" fill="#222"/>
  <text x="120" y="345" fill="#222">first vertex</text>
  <text x="305" y="165" fill="#222">last vertex</text>
  <path d="M170,230 A90,90 0 0,1 229,252" fill="none" stroke="#e8562a" stroke-width="2.5"/>
  <text x="200" y="222" fill="#e8562a" font-weight="600">θ</text>
  <text x="30" y="372" fill="#444" font-size="13">θ is measured clockwise from north, like a compass.</text>

  <!-- right: 8-point compass sectors -->
  <text x="450" y="32" font-weight="600" fill="#222">2. Bearing → compass word (8 sectors of 45°)</text>
  <g transform="translate(640,200)">
    <circle r="130" fill="#f4f6f8" stroke="#d0d7de"/>
    <!-- sector borders at 22.5 + k*45 degrees (clockwise from north) -->
    <g stroke="#b9c2cc" stroke-width="1.5">
      <line x1="0" y1="0" x2="49.7" y2="-120.1"/>
      <line x1="0" y1="0" x2="120.1" y2="-49.7"/>
      <line x1="0" y1="0" x2="120.1" y2="49.7"/>
      <line x1="0" y1="0" x2="49.7" y2="120.1"/>
      <line x1="0" y1="0" x2="-49.7" y2="120.1"/>
      <line x1="0" y1="0" x2="-120.1" y2="49.7"/>
      <line x1="0" y1="0" x2="-120.1" y2="-49.7"/>
      <line x1="0" y1="0" x2="-49.7" y2="-120.1"/>
    </g>
    <g font-weight="600" fill="#222" text-anchor="middle">
      <text x="0" y="-92">N</text><text x="68" y="-62">NE</text><text x="98" y="6">E</text><text x="68" y="76">SE</text>
      <text x="0" y="104">S</text><text x="-68" y="76">SW</text><text x="-98" y="6">W</text><text x="-68" y="-62">NW</text>
    </g>
    <g fill="#666" font-size="12" text-anchor="middle">
      <text x="54" y="-136">22.5°</text><text x="152" y="-52">67.5°</text>
      <text x="-56" y="-136">337.5°</text>
    </g>
  </g>
  <text x="450" y="372" fill="#444" font-size="13">N covers 337.5° to 22.5°, NE covers 22.5° to 67.5°, and so on.</text>
</svg>
